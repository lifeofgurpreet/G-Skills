name: Build VPS Health launch media
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/skills/vps-health/launch_media.py'
      - 'tools/skills/vps-health/test_launch_media.py'
      - '.github/workflows/launch-media.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install developer-only rendering tools
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-lato
      - name: Check the short-film contract
        run: python tools/skills/vps-health/test_launch_media.py
      - name: Render actual synthetic product captures and verify complete videos
        run: python tools/skills/vps-health/launch_media.py --out "$RUNNER_TEMP/launch-media"
      - name: Retain community-ready media, not private workspaces or native traces
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vps-health-launch-media-${{ github.sha }}
          path: |
            ${{ runner.temp }}/launch-media/*.mp4
            ${{ runner.temp }}/launch-media/*.srt
            ${{ runner.temp }}/launch-media/*poster.jpg
            ${{ runner.temp }}/launch-media/*frame-*.jpg
            ${{ runner.temp }}/launch-media/media-manifest.json
          if-no-files-found: error
          retention-days: 14
